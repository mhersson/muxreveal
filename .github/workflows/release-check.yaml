name: Release check

# Not a required check: a path filter would leave a required check pending on
# every other pull request.
on:
  pull_request:
    branches: [main]
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/release.yaml"
      - ".github/workflows/release-check.yaml"
      - ".github/release-notes/**"
      - "scripts/release-check.sh"
      - "scripts/release-notes.sh"
      - "scripts/release-notes-check.sh"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true

      - run: make release-dry
