name: Nightly Race Check

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The pull-request race suite run twice in one process, so a test that only
  # fails on a repeat shows up across the two runs.
  race-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: make test-race at -count=2
        run: make test-race
        env:
          # TestBenchKitOnSynth times out at -count=2, so the nightly run skips it.
          GOFLAGS: "-count=2 -skip=^TestBenchKitOnSynth$"
